[project]
name = "ecowatch-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.12",
    "pillow>=11.3.0",
    "cloudinary>=1.41.0",
    "boto3>=1.35.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
